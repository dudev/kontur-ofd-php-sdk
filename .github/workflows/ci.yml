name: CI

# Branch pushes are covered by the pull_request run; `push` only for main, so a PR isn't checked twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  composer-validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
      - run: composer validate --no-check-all --strict --no-check-publish

  security-audit:
    name: composer audit
    runs-on: ubuntu-latest
    needs: composer-validate
    env:
      PHP_VERSION: "8.2"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # composer.lock is not committed, so key on composer.json.
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      # Uses the FriendsOfPHP/security-advisories database (built into Composer since 2.4).
      - run: composer audit

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: phpcs:3.13.1
          coverage: none
      - run: phpcs

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    needs: composer-validate
    env:
      PHP_VERSION: "8.2"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # composer.lock is not committed, so key on composer.json.
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpstan analyse --no-progress

  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    needs: composer-validate
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # composer.lock is not committed, so key on composer.json.
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
