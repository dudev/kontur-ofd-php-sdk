name: MegaLinter

# Branch pushes are covered by the pull_request run; `push` only for main, so a PR isn't checked twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  # GitHub Comment Reporter posts the summary on pull requests.
  pull-requests: write

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/php@v8
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log
