# https://megalinter.io/latest/config-file/
APPLY_FIXES: none
FILTER_REGEX_EXCLUDE: "(vendor/|megalinter-reports/)"
DISABLE:
  # Noisy on Russian-language commit messages/docs without a custom dictionary.
  - SPELL
  # Low value on a small, young repo — mostly flags intentionally similar test fixtures.
  - COPYPASTE
DISABLE_LINTERS:
  # Need vendor/ (autoloader, phpstan-phpunit extension), which MegaLinter doesn't install.
  # PHPStan (level 9) runs in ci.yml after composer install; Psalm would duplicate it.
  - PHP_PHPSTAN
  - PHP_PSALM
  # Code style is checked by the `code-style` job in ci.yml (phpcs.xml, .php-cs-fixer.dist.php).
  - PHP_PHPCS
  - PHP_PHPCSFIXER
  # Scans lockfiles/installed packages, but composer.lock is gitignored and MegaLinter
  # doesn't install vendor/, so there is nothing for it to scan; on top of that its
  # vulnerability DB fails to load in the v8 image. Dependencies are checked by
  # `composer audit` in ci.yml against the resolved set.
  - REPOSITORY_GRYPE
PRINT_ALPACA: false
